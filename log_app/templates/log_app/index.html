
{% extends "base.html" %}
{% block content %}
<!--index.html-->
<p>
    <input
        value="Add a new item"
        type="button"
        onclick="location.href='{% url "log-add" %}'"
    />
    <input
        value="View Usage Chart"
        type="button"
        onclick="location.href='{% url "usage-over-time" %}'"
    />
</p>
<h3>Hay Types</h3>
{% include "log_app/_hay_table.html" %}
<p><a href="{% url "hay-details" %}">Details</a></p>

<h3>Recent logs</h3>
{% include "log_app/_log_table.html" with logs=object_list %}
<p><a href="{% url "log-view" %}">All logs</a></p>
<p>
    <input
        value="Download CSV"
        type="button"
        onclick="location.href='{% url "download-csv" %}'"
    />
</p>
{% endblock %}
