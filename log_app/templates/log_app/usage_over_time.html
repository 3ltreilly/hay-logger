{% extends "base.html" %}
{% block content %}
<h2>Hay Inventory Running Total</h2>
<p>
    <input value="Back to Dashboard" type="button" onclick="location.href='{% url "index" %}'" />
</p>
<form method="get" action="{% url 'usage-over-time' %}">
    <label for="start_date">Start date</label>
    <input id="start_date" name="start_date" type="date" value="{{ start_date }}" />
    <label for="end_date">End date</label>
    <input id="end_date" name="end_date" type="date" value="{{ end_date }}" />
    <button type="submit">Apply</button>
    <a href="{% url 'usage-over-time' %}">Clear</a>
</form>
<canvas id="usageChart" width="800" height="400"></canvas>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const labels = {{ usage_labels|safe }};
  const datasets = {{ usage_datasets|safe }};
  const ctx = document.getElementById('usageChart').getContext('2d');

  new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: datasets
    },
    options: {
      scales: {
        y: { beginAtZero: true }
      }
    }
  });
</script>
{% endblock %}
