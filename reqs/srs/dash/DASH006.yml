text: 'The hay details page, opened from the dashboard''s Details link, shows for
  each hay type the total, the 60-, 180- and 365-day burn rates (DASH002), the empty
  date and the throw down. Like the dashboard, it has one column per hay type and
  one row per number. Example: first cutting with 120 bales withdrawn in the last
  60 days and 365 in the last year shows a 60-day rate of 2.0 and a 365-day rate of
  1.0.'
