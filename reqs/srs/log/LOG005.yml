text: 'The dashboard lists the 10 logs with the latest dates, newest first, each with
  its date, hay type and a signed amount: a deposit of 100 shows as +100 and a withdrawal
  of 5 as -5. Tapping the date opens that log''s Edit form. Notes are not shown on
  the dashboard. An All logs link opens a page that lists every log the same way,
  newest first, with its notes. Example: with 25 logs the dashboard lists the 10 newest
  and the All logs page lists all 25; with 4 logs both list all 4.'
