text: 'For each hay type, the dashboard shows burn rates over 60, 180 and 365 days:
  bales withdrawn in that many days up to and including the latest withdrawal, divided
  by the number of days, rounded to 2 decimals. A hay type with no withdrawals shows
  no burn rates. Example: 120 bales withdrawn in the 60 days up to the latest withdrawal
  gives a 60-day rate of 2.0.'
