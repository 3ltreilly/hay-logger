[project]
name = "hay_logger"
version = "0.3.0"
description = "track hay in the barn"
authors = [{ name = "Bernie Reilly", email = "reilly_bernie@mac.com" }]
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0.6,<6",
    "pytz>=2024.1,<2025",
    "gunicorn>=22.0.0,<23",
    "whitenoise>=6.12.0,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.2.2,<9",
    "pre-commit>=3.7.1,<4",
    "ruff>=0.11.0,<0.12",
    "pytest-django>=4.14.0,<5",
    "pytest-cov>=7.1.0",
    "jamb>=2.0.0",
]
# only for up_load/up_load_script.py; install with `uv sync --group upload`
upload = [
    "pandas>=2.2.2,<3",
]

[tool.uv]
# this is a Django site, not a library: uv installs the dependencies but not the project itself
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "hay_logger.settings"
python_files = ["tests.py", "test_*.py"]
# staticfiles/ only exists in the Docker image, where collectstatic creates it
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
# Same as Black.
line-length = 100
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F", "I"]
ignore = []

[tool.jamb]
test_documents = ["SRS"]
trace_to_ignore = ["PRJ"]
